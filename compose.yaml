services:
  pharmacy-app:
    ports:
      - 9000:8080
    build: .    
    image: pharmacy:v2.0
    depends_on:
      - pharmacy-db
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M  
    networks:
      - pharmacy-network

  pharmacy-db:
    image: mysql:8.0
    ports:
      - 3307:3306  
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: Pharma_Assist

    volumes:
      - pharmacy-data:/var/lib/mysql
    networks:
      - pharmacy-network    

volumes:
  pharmacy-data:
    external: true

networks:
  pharmacy-network:
    external: true  
